[package]
name = "gitops-updater"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
reqwest = { version = "0.12.24", default-features=false, features = ["system-proxy", "json", "blocking", "rustls-tls"] }
anyhow = "1.0.100"
semver = "1.0.27"
tokio = { version = "1.48.0", features = ["full"] }
serde_json = "1.0.145"
nondestructive = "0.0.28"
rand = "0.9.2"
homedir = "0.3.6"
base64 = "0.22.1"
regex = "1.12.2"
dialoguer = { version = "0.12.0", default-features = false }
