[package]
name = "gitops-updater"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
reqwest = { version = "0.13.5", default-features=false, features = ["system-proxy", "json", "blocking", "rustls"] }
anyhow = "1.0.104"
semver = "1.0.28"
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1.0.151"
nondestructive = "0.0.28"
rand = "0.10.2"
homedir = "0.3.6"
base64 = "0.23.1"
regex = "1.13.1"
dialoguer = { version = "0.12.0", default-features = false }
