[package]
name = "gitops-updater"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
reqwest = { version = "0.13.4", default-features=false, features = ["system-proxy", "json", "blocking", "rustls"] }
anyhow = "1.0.102"
semver = "1.0.28"
tokio = { version = "1.52.3", features = ["full"] }
serde_json = "1.0.150"
nondestructive = "0.0.28"
rand = "0.10.1"
homedir = "0.3.6"
base64 = "0.22.1"
regex = "1.12.3"
dialoguer = { version = "0.12.0", default-features = false }
