[package]
name = "gitops-updater"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.2.0"
reqwest = { version = "0.13.5", default-features=false, features = ["system-proxy", "json", "blocking", "rustls"] }
anyhow = "1.0.104"
semver = "1.0.28"
tokio = { version = "1.54.1", features = ["full"] }
serde_json = "1.0.154"
nondestructive = "0.0.29"
rand = "0.10.4"
homedir = "0.3.6"
base64 = "0.23.1"
regex = "1.13.2"
dialoguer = { version = "0.12.0", default-features = false }
