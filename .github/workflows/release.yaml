name: release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release - ${{ matrix.platform.os-name }}
    strategy:
      matrix:
        platform:
          - os-name: Linux-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary_suffix: linux-amd64

          - os-name: Linux-aarch64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary_suffix: linux-aarch64

          - os-name: Windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            binary_suffix: windows-amd64.exe

          - os-name: macOS-aarch64
            runs-on: macos-latest
            target: aarch64-apple-darwin
            binary_suffix: macos-aarch64

    runs-on: ${{ matrix.platform.runs-on }}
    steps:

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Build binary
        uses: houseabsolute/actions-rust-cross@fe6ede73c7f0a50412ec05994e2aa5a7bf635eac #v1.0.7
        with:
          command: build
          toolchain: 1.96.0
          target: ${{ matrix.platform.target }}
          args: "--locked --release"
          strip: true

      - name: Prepare binary
        shell: bash
        run: |
          if [ -f target/${{ matrix.platform.target }}/release/gitops-updater.exe ]; then
            mv target/${{ matrix.platform.target }}/release/gitops-updater.exe gitops-updater-${{ matrix.platform.binary_suffix}}
          else
            mv target/${{ matrix.platform.target }}/release/gitops-updater gitops-updater-${{ matrix.platform.binary_suffix}}
          fi

      - name:  Publish artifacts
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda #v3.0.0
        with:
          draft: true
          files: gitops-updater-${{ matrix.platform.binary_suffix}}
