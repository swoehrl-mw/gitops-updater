apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
  namespace: default
spec:
  interval: 10m
  targetNamespace: default
  sourceRef:
    kind: GitRepository
    name: gitops
  path: "./example/apps/podinfo"
  prune: true
  timeout: 1m
  postBuild:
    substitute:
      podinfoVersion: "1.2.3"
