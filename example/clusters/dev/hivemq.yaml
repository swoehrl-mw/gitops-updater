apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hivemq
  namespace: default
spec:
  interval: 10m
  targetNamespace: default
  sourceRef:
    kind: GitRepository
    name: gitops
  path: "./example/apps/hivemq"
  prune: true
  timeout: 1m
  postBuild:
    substitute:
      hivemqVersion: "4.27.0"
