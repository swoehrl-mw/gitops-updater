apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus
  namespace: default
spec:
  interval: 10m
  targetNamespace: default
  sourceRef:
    kind: GitRepository
    name: gitops
  path: "./example/apps/kube-prometheus-stack"
  prune: true
  timeout: 1m
  postBuild:
    substitute:
      kpsVersion: "1.2.3"
